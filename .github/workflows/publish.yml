name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Check version not yet published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view dsh-session-replay@"$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published — skipping."
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "Version $VERSION is not published yet — proceeding."
          fi

      - name: Publish to npm
        if: env.SKIP_PUBLISH != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version
        if: env.SKIP_PUBLISH != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm view dsh-session-replay@"$VERSION" version
