<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会话回放 · __TITLE__</title>
<style>
  /* ── DSH native look (light theme, standalone embed) ── */
  :root {
    --bg-base: #f7f8fa;
    --bg-layer-1: #ffffff;
    --bg-layer-2: #f0f2f5;
    --sidebar-fill: #ffffff;
    --border-l1: rgba(0,0,0,0.06);
    --border-l2: rgba(0,0,0,0.12);
    --text-primary: #1a1d24;
    --text-secondary: #5c6474;
    --text-tertiary: #9aa1af;
    --accent: #4d6bfe;
    --accent-soft: rgba(77,107,254,0.08);
    --green: #16a34a;
    --red: #dc2626;
    --amber: #b45309;
    --bubble-user: #eef1f8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  .frame { display: grid; grid-template-columns: 264px 1fr; height: 100vh; }
  .sidebarCol {
    background: var(--sidebar-fill);
    border-right: 1px solid var(--border-l1);
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .centerCol { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg-base); }

  .side-scroll { flex: 1; overflow-y: auto; padding: 6px 10px; }
  .brand-row { display: flex; align-items: center; gap: 8px; padding: 16px 10px 12px; flex: none; }
  .brand-logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 700;
  }
  .brand-name { font-size: 14px; font-weight: 600; letter-spacing: .3px; }
  .brand-name .h { color: var(--text-tertiary); font-weight: 500; }
  .new-session {
    display: flex; align-items: center; gap: 8px;
    width: calc(100% - 20px); margin: 0 10px 10px; padding: 8px 10px;
    background: var(--accent-soft); color: var(--text-primary);
    border: 1px solid rgba(77,107,254,0.3); border-radius: 8px;
    font-size: 13px; cursor: pointer; flex: none;
  }
  .nav-group { margin-bottom: 14px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px;
    color: var(--text-secondary); font-size: 13px; cursor: pointer;
  }
  .nav-item.active { background: var(--bg-layer-2); color: var(--text-primary); }
  .nav-ico { width: 17px; text-align: center; font-size: 13px; }
  .sess-header {
    padding: 10px 10px 6px; font-size: 11px; color: var(--text-tertiary);
    letter-spacing: .6px; text-transform: uppercase;
  }
  .sess-item { padding: 8px 10px; border-radius: 7px; font-size: 12.5px; line-height: 1.4; }
  .sess-item.active { background: var(--bg-layer-2); }
  .sess-item .t { color: var(--text-primary); display: block; }
  .sess-item .d { color: var(--text-tertiary); font-size: 11px; margin-top: 2px; }
  .side-foot { padding: 10px; border-top: 1px solid var(--border-l1); flex: none; }
  .side-foot-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px;
    color: var(--text-secondary); font-size: 13px; cursor: pointer;
  }

  .conv-header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--border-l1); background: var(--bg-layer-1);
  }
  .conv-title { font-size: 14px; font-weight: 600; }
  .conv-tag {
    font-size: 11px; color: var(--text-secondary); background: var(--bg-layer-2);
    border: 1px solid var(--border-l1); border-radius: 99px; padding: 2px 10px;
  }
  .conv-spacer { flex: 1; }
  .playbar {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-layer-2); border: 1px solid var(--border-l1);
    border-radius: 10px; padding: 5px 10px;
  }
  .playbar .btn {
    background: var(--bg-layer-1); color: var(--text-primary); border: 1px solid var(--border-l2);
    border-radius: 7px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .playbar .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .playbar .time {
    font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 74px; text-align: center;
  }
  .playbar input[type=range] {
    width: 110px; appearance: none; height: 4px; border-radius: 2px; background: var(--border-l2); outline: none; cursor: pointer;
  }
  .playbar input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; cursor: pointer;
  }
  .speed-group { display: flex; gap: 2px; }
  .speed-btn {
    background: transparent; color: var(--text-tertiary); border: none; border-radius: 5px;
    padding: 3px 6px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .speed-btn.active { background: var(--bg-layer-1); color: var(--text-primary); }

  .stage { flex: 1; overflow-y: auto; padding: 24px 0 32px; background: var(--bg-base); }
  .stage-inner { max-width: 820px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; opacity: 0; transform: translateY(8px); }
  .msg.visible { animation: rise .3s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-top: 2px; user-select: none;
  }
  .avatar.user { background: #e6ebf8; color: #4d6bfe; }
  .avatar.assistant { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff; font-weight: 700; font-size: 13px; }
  .avatar.tool { background: var(--bg-layer-2); border: 1px solid var(--border-l1); font-size: 12px; }
  .body { flex: 1; min-width: 0; }
  .bubble { line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .bubble.user {
    background: var(--bubble-user); border: 1px solid var(--border-l1);
    border-radius: 12px; padding: 10px 14px; font-size: 14px;
  }
  .bubble.assistant { font-size: 14px; }
  .bubble .caret {
    display: inline-block; width: 7px; height: 15px; background: var(--accent);
    vertical-align: text-bottom; animation: blink .8s step-end infinite; border-radius: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .system-note {
    font-size: 11.5px; color: var(--text-tertiary); border: 1px dashed var(--border-l2);
    border-radius: 8px; padding: 5px 10px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%; background: var(--bg-layer-1);
  }
  .reasoning {
    font-size: 13px; color: var(--text-secondary); background: var(--bg-layer-1);
    border-left: 2px solid var(--amber); border-radius: 0 8px 8px 0; padding: 10px 14px;
    margin-bottom: 8px; white-space: pre-wrap; display: none; line-height: 1.6;
  }
  .reasoning.open { display: block; }
  .reasoning-toggle {
    font-size: 12px; color: var(--amber); cursor: pointer; user-select: none;
    margin: 4px 0 8px; display: inline-block;
  }
  .tool-card {
    background: var(--bg-layer-1); border: 1px solid var(--border-l1);
    border-radius: 10px; margin-top: 10px; overflow: hidden;
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px;
    cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: var(--bg-layer-2); }
  .tool-name { font-family: var(--mono); color: var(--accent); font-weight: 600; font-size: 12px; }
  .tool-badge {
    font-size: 10.5px; padding: 1px 8px; border-radius: 99px; background: var(--bg-layer-2); color: var(--text-tertiary);
  }
  .tool-badge.ok { color: var(--green); }
  .tool-badge.err { color: var(--red); }
  .tool-chev { margin-left: auto; color: var(--text-tertiary); transition: transform .2s; }
  .tool-card.open .tool-chev { transform: rotate(90deg); }
  .tool-detail { display: none; border-top: 1px solid var(--border-l1); padding: 10px 12px; }
  .tool-card.open .tool-detail { display: block; }
  .tool-detail .label {
    font-size: 10.5px; color: var(--text-tertiary); text-transform: uppercase;
    letter-spacing: .6px; margin: 6px 0 4px;
  }
  .tool-detail pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--bg-layer-2);
    border: 1px solid var(--border-l1); border-radius: 6px; padding: 8px 10px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto;
  }
  .tool-detail .result.err pre { border-color: rgba(220,38,38,.4); color: var(--red); }
  .status-bar {
    flex: none; display: flex; align-items: center; gap: 16px; padding: 5px 20px;
    border-top: 1px solid var(--border-l1); background: var(--bg-layer-1);
    font-size: 11px; color: var(--text-tertiary); white-space: nowrap; overflow-x: auto;
  }
  .status-bar .m { display: inline-flex; align-items: center; gap: 5px; }
  .status-bar .m b { color: var(--text-secondary); font-weight: 500; }
  .share-note {
    text-align: center; font-size: 11px; color: var(--text-tertiary);
    padding: 4px 0 0; max-width: 820px; margin: 0 auto;
  }
  .empty { text-align: center; color: var(--text-tertiary); padding: 80px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="frame">
  <aside class="sidebarCol">
    <div class="brand-row">
      <div class="brand-logo">🐋</div>
      <div class="brand-name">deepseek <span class="h">HARNESS</span></div>
    </div>
    <div class="new-session"><span>＋</span> 新对话</div>
    <div class="side-scroll">
      <div class="nav-group">
        <div class="nav-item active"><span class="nav-ico">📋</span> 任务看板</div>
        <div class="nav-item"><span class="nav-ico">🔌</span> SSH</div>
        <div class="nav-item"><span class="nav-ico">🧩</span> 技能中心</div>
        <div class="nav-item"><span class="nav-ico">📁</span> 工作区</div>
      </div>
      <div class="sess-header">会话</div>
      <div id="sessList"></div>
    </div>
    <div class="side-foot">
      <div class="side-foot-item"><span class="nav-ico">⚙️</span> 设置</div>
    </div>
  </aside>
  <main class="centerCol">
    <div class="conv-header">
      <span class="conv-title" id="convTitle">会话回放</span>
      <span class="conv-tag" id="convPreset">标准模式</span>
      <span class="conv-spacer"></span>
      <div class="playbar">
        <button class="btn primary" id="playBtn">▶ 播放</button>
        <button class="btn" id="restartBtn">↺</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <div class="speed-group">
          <button class="speed-btn" data-speed="0.5">0.5×</button>
          <button class="speed-btn" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn active" data-speed="4">4×</button>
        </div>
      </div>
    </div>
    <div class="stage"><div class="stage-inner" id="stage"></div></div>
    <div class="share-note">🎬 dsh-replay 会话回放 · 本文件为独立分享版，数据已内嵌，可离线打开</div>
    <div class="status-bar" id="statusBar"></div>
  </main>
</div>

<script>
// ════════════ dsh-replay standalone player ════════════
const DATA = __DATA__;
const frames = DATA.frames || [];
const TITLE = DATA.title || '会话回放';
document.getElementById('convTitle').textContent = TITLE;
document.title = '会话回放 · ' + TITLE;
document.getElementById('convPreset').textContent = (DATA.agentPreset || '标准') + '模式';
if (DATA.agentPreset) {
  const p = String(DATA.agentPreset).toLowerCase();
  if (p.includes('minimal')) document.getElementById('convPreset').textContent = 'Minimal';
  else if (p.includes('ptc')) document.getElementById('convPreset').textContent = 'PTC Mode';
}
const stage = document.getElementById('stage');
const playBtn = document.getElementById('playBtn');
const restartBtn = document.getElementById('restartBtn');
const seek = document.getElementById('seek');
const timeEl = document.getElementById('time');

// Sidebar shows ONLY this session — no list of other sessions.
const sessList = document.getElementById('sessList');
sessList.innerHTML = '<div class="sess-item active"><span class="t"></span><span class="d">回放中 · 仅此会话</span></div>';
sessList.querySelector('.t').textContent = TITLE;

const totalMs = msFor(frames.length);
document.getElementById('statusBar').innerHTML =
  '<span class="m"><b>' + frames.length + '</b> 帧回放</span>' +
  '<span class="m">总时长 <b>' + fmtTime(totalMs) + '</b> @1×</span>' +
  '<span class="m">消息 <b>' + frames.filter(f => f.kind === 'assistant').length + '</b></span>' +
  '<span class="m">工具 <b>' + frames.filter(f => f.kind === 'tool').length + '</b></span>';

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function buildUserFrame(f) {
  const wrap = el('div', 'msg');
  if (f.system) {
    wrap.appendChild(el('div', 'avatar user', '⚙️'));
    const body = el('div', 'body');
    const note = el('div', 'system-note');
    const first = (f.text || '').split('\n').filter(Boolean)[0] || '';
    note.textContent = '系统注入 · ' + first.slice(0, 60);
    note.title = f.text;
    body.appendChild(note);
    wrap.appendChild(body);
    return { wrap, kind: 'user', system: true, full: f.text };
  }
  wrap.appendChild(el('div', 'avatar user', '👤'));
  const body = el('div', 'body');
  const b = el('div', 'bubble user', f.text);
  body.appendChild(b);
  wrap.appendChild(body);
  return { wrap, textEl: b, kind: 'user', full: f.text };
}
function buildAssistantFrame(f) {
  const wrap = el('div', 'msg');
  wrap.appendChild(el('div', 'avatar assistant', 'AI'));
  const body = el('div', 'body');
  if (f.reasoning) {
    const r = el('div', 'reasoning', f.reasoning);
    const t = el('span', 'reasoning-toggle', '💭 思考过程 ▸');
    t.onclick = () => {
      r.classList.toggle('open');
      t.textContent = r.classList.contains('open') ? '💭 思考过程 ▾' : '💭 思考过程 ▸';
    };
    body.appendChild(r);
    body.appendChild(t);
  }
  const b = el('div', 'bubble assistant');
  body.appendChild(b);
  for (const tc of (f.toolCalls || [])) body.appendChild(buildToolCard(tc, null));
  wrap.appendChild(body);
  return { wrap, textEl: b, kind: 'assistant', full: f.text };
}
function buildToolFrame(f) {
  const wrap = el('div', 'msg');
  wrap.appendChild(el('div', 'avatar tool', '🛠'));
  const body = el('div', 'body');
  body.appendChild(buildToolCard(
    { callId: f.callId, name: f.name, arguments: f.arguments },
    { text: f.result, isError: f.isError }
  ));
  wrap.appendChild(body);
  return { wrap, kind: 'tool', card: wrap.querySelector('.tool-card') };
}
function buildToolCard(tc, res) {
  const card = el('div', 'tool-card');
  const head = el('div', 'tool-head');
  head.appendChild(el('span', 'tool-name', tc.name));
  const badge = el('span', 'tool-badge' + (res && res.isError ? ' err' : res ? ' ok' : ''));
  badge.textContent = res ? (res.isError ? '执行失败' : '执行完成') : '待执行';
  head.appendChild(badge);
  head.appendChild(el('span', 'tool-chev', '›'));
  head.onclick = () => card.classList.toggle('open');
  card.appendChild(head);
  const detail = el('div', 'tool-detail');
  detail.appendChild(el('div', 'label', '参数'));
  detail.appendChild(el('pre', null, prettyArgs(tc.arguments)));
  if (res) {
    detail.appendChild(el('div', 'label', '结果'));
    detail.appendChild(el('pre', 'result' + (res.isError ? ' err' : ''), res.text || '(空)'));
  }
  card.appendChild(detail);
  return card;
}
function prettyArgs(args) {
  if (!args) return '(无参数)';
  try { return JSON.stringify(JSON.parse(args), null, 2); }
  catch { return args; }
}
const doms = frames.map((f) => {
  if (f.kind === 'user') return buildUserFrame(f);
  if (f.kind === 'assistant') return buildAssistantFrame(f);
  return buildToolFrame(f);
});

let speed = 4, playing = false, cursor = -1, raf = null, lastTs = 0, accum = 0;
function frameDuration(f) {
  let ms = 350;
  if (f.kind === 'user') ms = Math.max(300, Math.min(f.text.length * 18, 1800));
  if (f.kind === 'assistant') ms = Math.max(350, Math.min(f.text.length * 24, 2200));
  if (f.kind === 'tool') ms = 900;
  const gap = Math.min((f.gapMs || 0) / 60, 700);
  return ms + gap;
}
function msFor(idx) {
  let total = 0;
  for (let i = 0; i < idx && i < frames.length; i++) total += frameDuration(frames[i]);
  return total;
}
function fmtTime(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function showFrame(i, instant) {
  if (i < 0 || i >= doms.length) return;
  const dom = doms[i];
  if (dom.mounted) return;
  dom.mounted = true;
  stage.appendChild(dom.wrap);
  requestAnimationFrame(() => dom.wrap.classList.add('visible'));
  if (instant) {
    if (dom.textEl) dom.textEl.textContent = dom.full || '';
    if (dom.kind === 'tool' && dom.card) dom.card.classList.add('open');
  }
  dom.wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
}
function tick(ts) {
  if (!playing) { raf = null; return; }
  if (!lastTs) lastTs = ts;
  const dt = ts - lastTs; lastTs = ts; accum += dt * speed;
  let guard = 0;
  while (accum > 0 && guard++ < 200) {
    const nextIdx = cursor + 1;
    if (nextIdx >= frames.length) { finish(); return; }
    const f = frames[nextIdx];
    const dur = frameDuration(f);
    if (accum < dur && !(cursor === -1 && nextIdx === 0)) break;
    accum -= dur; cursor = nextIdx;
    showFrame(nextIdx, false);
    const dom = doms[nextIdx];
    if ((dom.kind === 'user' || dom.kind === 'assistant') && !dom.system) {
      const textEl = dom.textEl;
      textEl.textContent = '';
      textEl.appendChild(el('span', 'caret'));
      const caret = textEl.querySelector('.caret');
      const typeChar = () => {
        if (!dom._full) { caret.remove(); dom._done = true; return; }
        const ch = dom._full[0];
        dom._full = dom._full.slice(1);
        caret.remove();
        textEl.appendChild(document.createTextNode(ch));
        textEl.appendChild(caret);
        if (dom._full.length === 0) caret.remove();
      };
      dom._full = dom.full || '';
      dom._done = false;
      const interval = setInterval(typeChar, 25 / speed);
      dom._typeTimer = setInterval(() => {
        if (dom._full.length === 0) { clearInterval(interval); clearInterval(dom._typeTimer); }
      }, 50);
      setTimeout(() => {
        clearInterval(interval);
        if (dom._typeTimer) clearInterval(dom._typeTimer);
        textEl.textContent = dom.full || '';
      }, dur);
    }
    if (dom.kind === 'tool' && dom.card) dom.card.classList.add('open');
    updateProgress();
  }
  raf = requestAnimationFrame(tick);
}
function finish() {
  playing = false; playBtn.textContent = '▶ 播放';
  if (raf) cancelAnimationFrame(raf); raf = null;
  if (cursor < frames.length - 1) { cursor = frames.length - 1; showFrame(cursor, true); }
  seek.value = 1000; updateProgress();
}
function play() {
  if (playing) { pause(); return; }
  if (cursor >= frames.length - 1) reset();
  playing = true; playBtn.textContent = '⏸ 暂停';
  lastTs = 0; accum = 0; raf = requestAnimationFrame(tick);
}
function pause() {
  playing = false; playBtn.textContent = '▶ 播放';
  if (raf) cancelAnimationFrame(raf); raf = null;
}
function reset() {
  pause(); cursor = -1; accum = 0;
  for (const dom of doms) {
    dom.mounted = false;
    if (dom.wrap.parentNode) dom.wrap.parentNode.removeChild(dom.wrap);
    if (dom.textEl) dom.textEl.textContent = '';
    if (dom.card) dom.card.classList.remove('open');
    if (dom._typeTimer) clearInterval(dom._typeTimer);
    dom._full = undefined; dom._done = false;
  }
  stage.innerHTML = ''; seek.value = 0; updateProgress();
}
function updateProgress() {
  const pct = frames.length ? cursor / (frames.length - 1) : 0;
  seek.value = Math.round(pct * 1000);
  const cur = cursor >= 0 ? cursor + 1 : 0;
  timeEl.textContent = fmtTime(msFor(cur)) + ' / ' + fmtTime(msFor(frames.length));
}
playBtn.onclick = play;
restartBtn.onclick = reset;
seek.addEventListener('input', () => {
  const target = Math.round((seek.value / 1000) * (frames.length - 1));
  cursor = target - 1; accum = 0;
  for (const dom of doms) dom.mounted = false;
  stage.innerHTML = '';
  for (let i = 0; i <= target; i++) showFrame(i, true);
  updateProgress();
});
document.querySelectorAll('.speed-btn').forEach((b) => {
  if (b.dataset.s === '4') b.classList.add('active');
  else b.classList.remove('active');
  b.onclick = () => {
    document.querySelectorAll('.speed-btn').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    speed = parseFloat(b.dataset.s);
  };
});
updateProgress();
if (frames.length === 0) {
  stage.innerHTML = '<div class="empty">该会话没有可回放的内容</div>';
} else {
  // Auto-play at 4× on open.
